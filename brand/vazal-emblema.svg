<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 530" role="img" aria-label="Emblema Vazal">
  <defs>
    <linearGradient id="earL" x1="0" y1="0" x2=".65" y2="1">
      <stop offset="0" stop-color="#FFD75A"/>
      <stop offset=".45" stop-color="#E0B22C"/>
      <stop offset="1" stop-color="#8A6710"/>
    </linearGradient>
    <linearGradient id="earLt" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#FFE083"/>
      <stop offset="1" stop-color="#D9A827"/>
    </linearGradient>
    <linearGradient id="earR" x1="1" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#FFD75A"/>
      <stop offset=".45" stop-color="#E0B22C"/>
      <stop offset="1" stop-color="#8A6710"/>
    </linearGradient>
    <linearGradient id="earRt" x1="1" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FFE083"/>
      <stop offset="1" stop-color="#D9A827"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#8A6710"/>
      <stop offset=".45" stop-color="#E8B52E"/>
      <stop offset="1" stop-color="#FFD75A"/>
    </linearGradient>
    <linearGradient id="trunkG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6710"/>
      <stop offset=".5" stop-color="#E0B22C"/>
      <stop offset="1" stop-color="#FFD75A"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEDED"/>
      <stop offset="1" stop-color="#BFBFBF"/>
    </linearGradient>
    <linearGradient id="tuskG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5B5B5"/>
      <stop offset=".45" stop-color="#F7F7F7"/>
      <stop offset="1" stop-color="#CFCFCF"/>
    </linearGradient>
  </defs>

  <!-- cara facetada -->
  <polygon points="222,42 410,42 440,300 315,378 190,300" fill="url(#faceG)"/>
  <polygon points="222,42 410,42 340,200 290,200" fill="#E2E2E2"/>
  <polygon points="222,42 290,200 300,370 190,300" fill="#CBCBCB"/>
  <polygon points="410,42 440,300 330,370 340,200" fill="#CBCBCB"/>
  <polyline points="224,46 292,202 302,366" fill="none" stroke="#F5F5F5" stroke-width="7"/>
  <polyline points="408,46 338,202 328,366" fill="none" stroke="#F5F5F5" stroke-width="7"/>

  <!-- colmillos -->
  <path d="M210,268 C204,350 206,445 222,512 C226,522 236,521 238,510 C244,430 242,340 244,280 Z" fill="url(#tuskG)"/>
  <path d="M230,272 C234,320 234,400 233,460" fill="none" stroke="#8C8C8C" stroke-width="5" opacity=".6"/>
  <path d="M420,268 C426,350 424,445 408,512 C404,522 394,521 392,510 C386,430 388,340 386,280 Z" fill="url(#tuskG)"/>
  <path d="M400,272 C396,320 396,400 397,460" fill="none" stroke="#8C8C8C" stroke-width="5" opacity=".6"/>

  <!-- oreja izquierda -->
  <polygon points="150,15 10,105 14,158 56,135" fill="url(#earLt)"/>
  <polygon points="150,15 14,158 140,324 164,317 176,120 228,42" fill="url(#earL)"/>
  <!-- oreja derecha -->
  <polygon points="480,15 620,105 616,158 574,135" fill="url(#earRt)"/>
  <polygon points="480,15 616,158 490,324 466,317 454,120 402,42" fill="url(#earR)"/>

  <!-- V de la frente -->
  <polygon points="240,26 288,26 315,105 342,26 390,26 338,166 292,166" fill="url(#vGrad)"/>

  <!-- trompa -->
  <rect x="290" y="200" width="50" height="178" rx="18" fill="url(#trunkG)"/>
  <rect x="290" y="212" width="50" height="16" rx="7" fill="#FFE083" opacity=".85"/>
</svg>
